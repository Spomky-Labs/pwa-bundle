name: "Integrate"

on:
  push:
    branches:
      - "*.x"
  pull_request:

jobs:
  byte_level:
    name: "0️⃣ Byte-level"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Check file permissions"
        run: |
          NON_EXECUTABLE=$(find . -type f -not -path './.git/*' -not -path './link' -executable)
          if [[ -n "$NON_EXECUTABLE" ]]; then
            echo "Found non-executable files with executable permission:"
            echo "$NON_EXECUTABLE"
            exit 1
          fi

      - name: "Find non-printable ASCII characters"
        run: |
          if LC_ALL=C.UTF-8 find . -type f -name "*.php" -print0 | xargs -0 grep -PHn "[[:cntrl:]]"; then
            echo "Non-printable ASCII characters found"
            exit 1
          fi

  phpstan:
    name: "1️⃣ Static Analysis (PHPStan)"
    needs: [byte_level]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.4
    steps:
      - uses: actions/checkout@v4

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: --optimize-autoloader

      - run: phpstan analyse --configuration=.ci-tools/phpstan.neon

  ecs:
    name: "2️⃣ Coding Standards (ECS)"
    needs: [byte_level]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.4
    steps:
      - uses: actions/checkout@v4

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: --optimize-autoloader

      - run: ecs check --config .ci-tools/ecs.php

  rector:
    name: "3️⃣ Rector"
    needs: [byte_level]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.4
    steps:
      - uses: actions/checkout@v4

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: --optimize-autoloader

      - run: rector process --dry-run --config .ci-tools/rector.php

  lint:
    name: "4️⃣ Lint"
    needs: [byte_level]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.4
    steps:
      - uses: actions/checkout@v4
      - run: composer exec -- parallel-lint src tests

  validate:
    name: "5️⃣ Validate composer.json"
    needs: [byte_level]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.4
    steps:
      - uses: actions/checkout@v4
      - run: |
          composer dump-autoload --optimize --strict-psr
          composer validate --strict

  check_licenses:
    name: "6️⃣ Check licenses"
    needs: [byte_level]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.4
    steps:
      - uses: actions/checkout@v4
      - run: castor check-licenses

  deptrac:
    name: "7️⃣ Deptrac"
    needs: [byte_level]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.4
    steps:
      - uses: actions/checkout@v4

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: --optimize-autoloader

      - run: deptrac --config-file .ci-tools/deptrac.yaml --report-uncovered --report-skipped --fail-on-uncovered

  unit_tests:
    name: "8️⃣ Unit & Functional Tests"
    needs:
      - phpstan
      - ecs
      - rector
      - lint
      - validate
      - check_licenses
      - deptrac
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: [8.4]
    container:
      image: ghcr.io/spomky-labs/phpqa:${{ matrix.php-version }}
    env:
      XDEBUG_MODE: coverage
    steps:
      - uses: actions/checkout@v4

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: --optimize-autoloader

      - name: Run PHPUnit
        run: phpunit --coverage-xml .ci-tools/coverage  --log-junit=.ci-tools/coverage/junit.xml --configuration .ci-tools/phpunit.xml.dist

  exported_files:
    name: "9️⃣ Exported files"
    needs: [byte_level]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check exported files
        run: |
          EXPECTED="LICENSE,README.md,RELEASES.md,SECURITY.md,composer.json"
          CURRENT=$(git archive HEAD | tar --list | grep -v '/$' | grep -Ev '^(.ci-tools|assets|src|templates)/' | sort | paste -sd "," -)
          echo "CURRENT = ${CURRENT}"
          echo "EXPECTED = ${EXPECTED}"
          if [[ "$CURRENT" != "$EXPECTED" ]]; then
            echo "❌ Exported files do not match expected list"
            exit 1
          fi
